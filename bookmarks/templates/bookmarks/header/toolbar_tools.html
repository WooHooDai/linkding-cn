{% load i18n %}
{% comment %}
列表工具栏第二行：排序 / 分组 / 全部展开折叠。
窄屏把排序与分组各压成一颗图标按钮，点开就是原生选择列表（透明 select 铺满按钮）。
{% endcomment %}
<div class="header-tools-filters">
  <div class="header-tools-wide">
    <div class="input-group header-tool-group">
      <span class="input-group-addon text-secondary" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 9l4 -4l4 4m-4 -4v14"/><path d="M21 15l-4 4l-4 -4m4 4v-14"/></svg>
      </span>
      <select class="form-select header-tool-select" data-toolbar-nav="sort"
              title="{% translate 'Sort by' %}">
        {% for value, label in sort_choices %}
          <option value="{{ value }}"{% if bookmark_list.search.sort == value %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    {% if not hide_group %}
    <div class="input-group header-tool-group">
      <span class="input-group-addon text-secondary" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="4.5" cy="8" r="1.4" fill="currentColor" stroke="none"/><path d="M9.5 8h11"/><circle cx="4.5" cy="16" r="1.4" fill="currentColor" stroke="none"/><path d="M9.5 16h11"/></svg>
      </span>
      <select class="form-select header-tool-select"
              data-toolbar-pref="group_by_date" data-toolbar-pref-apply="fragment"
              title="{% translate 'Group by' %}">
        <option value="">{% translate "None" %}</option>
        <option value="on"{% if bookmark_list.group_by_date %} selected{% endif %}>{% translate "Date" context "group_option" %}</option>
      </select>
    </div>
    {% endif %}
  </div>

  <div class="header-tools-narrow">
    <span class="btn header-tool-icon header-tool-picker" title="{% translate 'Sort by' %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <path d="M3 9l4 -4l4 4m-4 -4v14"/><path d="M21 15l-4 4l-4 -4m4 4v-14"/>
      </svg>
      <select class="header-tool-picker-native" data-toolbar-nav="sort"
              aria-label="{% translate 'Sort by' %}">
        {% for value, label in sort_choices %}
          <option value="{{ value }}"{% if bookmark_list.search.sort == value %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </span>

    {% if not hide_group %}
    <span class="btn header-tool-icon header-tool-picker" title="{% translate 'Group by' %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <circle cx="4.5" cy="8" r="1.4" fill="currentColor" stroke="none"/><path d="M9.5 8h11"/><circle cx="4.5" cy="16" r="1.4" fill="currentColor" stroke="none"/><path d="M9.5 16h11"/>
      </svg>
      <select class="header-tool-picker-native"
              data-toolbar-pref="group_by_date" data-toolbar-pref-apply="fragment"
              aria-label="{% translate 'Group by' %}">
        <option value="">{% translate "None" %}</option>
        <option value="on"{% if bookmark_list.group_by_date %} selected{% endif %}>{% translate "Date" context "group_option" %}</option>
      </select>
    </span>
    {% endif %}
  </div>

  {% if not hide_group %}
  <div class="header-group-actions" {% if not bookmark_list.group_by_date %}hidden{% endif %}>
    <button type="button" class="btn header-tool-icon" data-group-expand-all
            aria-label="{% translate 'Expand all' %}" title="{% translate 'Expand all' %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M7 6l5 5l5 -5"></path>
        <path d="M7 12l5 5l5 -5"></path>
      </svg>
    </button>
    <button type="button" class="btn header-tool-icon" data-group-collapse-all
            aria-label="{% translate 'Collapse all' %}" title="{% translate 'Collapse all' %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M7 11l5 -5l5 5"></path>
        <path d="M7 17l5 -5l5 5"></path>
      </svg>
    </button>
  </div>
  {% endif %}
</div>
