{% load i18n %}
{% comment %}
界面设置（语言 + 主题）：书签页与高亮页的「布局」抽屉共用。
语言走独立表单提交（切换后整页换语言），主题按 reload 生效。
{% endcomment %}
<form action="{% url 'language-update' %}" method="post" class="ld-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="ld-row">
    <div class="ld-row-text">
      <span class="ld-row-label">{% translate "Language" %}</span>
    </div>
    <div class="ld-row-control">
      <div class="ld-segment" role="radiogroup" aria-label="{% translate 'Language' %}">
        {% for code, label in primary_language_choices %}
          <label class="ld-segment-option">
            <input type="radio" name="language" value="{{ code }}"
                   {% if language_segment_value == code %}checked{% endif %}>
            <span>{{ label }}</span>
          </label>
        {% endfor %}
        <label class="ld-segment-option">
          <input type="radio" name="language" value="{{ language_other_sentinel }}"
                 data-language-other-toggle
                 {% if language_segment_value == language_other_sentinel %}checked{% endif %}>
          <span>...</span>
        </label>
      </div>
    </div>
  </div>
  <div class="ld-row" data-language-other
       {% if language_segment_value != language_other_sentinel %}hidden{% endif %}>
    <div class="ld-row-text">
      <span class="ld-row-label">{% translate "Other languages" %}</span>
    </div>
    <div class="ld-row-control">
      <select name="language" class="form-select input-sm ld-control-select ld-control-language"
              data-language-select
              {% if language_segment_value != language_other_sentinel or not other_language_choices %}disabled{% endif %}>
        {% if other_language_choices %}
          <option value="" disabled>...</option>
          {% for code, label in other_language_choices %}
            <option value="{{ code }}"
                    {% if language_other_current_code == code %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        {% else %}
          <option value="" selected>{% translate "No other languages" %}</option>
        {% endif %}
      </select>
    </div>
  </div>
</form>

<div class="ld-row">
  <div class="ld-row-text">
    <span class="ld-row-label">{% translate "Theme" %}</span>
  </div>
  <div class="ld-row-control">
    <div class="ld-segment ld-control-segment" role="radiogroup" aria-label="{% translate 'Theme' %}">
      <label class="ld-segment-option">
        <input type="radio" name="theme" value="auto"
               data-pref="theme" data-pref-apply="reload"
               {% if request.user_profile.theme == 'auto' %}checked{% endif %}>
        <span>{% translate "Auto" %}</span>
      </label>
      <label class="ld-segment-option">
        <input type="radio" name="theme" value="light"
               data-pref="theme" data-pref-apply="reload"
               {% if request.user_profile.theme == 'light' %}checked{% endif %}>
        <span>{% translate "Light" %}</span>
      </label>
      <label class="ld-segment-option">
        <input type="radio" name="theme" value="dark"
               data-pref="theme" data-pref-apply="reload"
               {% if request.user_profile.theme == 'dark' %}checked{% endif %}>
        <span>{% translate "Dark" %}</span>
      </label>
    </div>
  </div>
</div>
