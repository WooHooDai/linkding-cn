{% load i18n %}
{% comment %}
窄屏「更多」菜单：随机按钮在窄屏常驻，批量编辑与布局没地方放，收进这里。
菜单只常驻 DOM、由 .header-controls 的 has-random 决定显隐——抽屉里开关随机按钮后
不用刷新就能在「窄屏三个按钮」与「随机 + 更多」之间切换。显示偏好仍统一在布局抽屉里。
{% endcomment %}
<ld-dropdown class="header-more dropdown dropdown-right" data-header-more
             data-save-url="{% url 'linkding:settings.save' %}">
  <button type="button" class="btn dropdown-toggle"
          aria-label="{% translate 'More options' %}"
          title="{% translate 'More options' %}">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
         fill="currentColor" stroke="none">
      <circle cx="12" cy="5" r="1.9"></circle>
      <circle cx="12" cy="12" r="1.9"></circle>
      <circle cx="12" cy="19" r="1.9"></circle>
    </svg>
  </button>
  <div class="menu menu-panel header-more-panel" tabindex="0">
    {% if show_bulk %}
      {# 整行是按钮，图标只是装饰：点标签或空白处都算点击 #}
      <button type="button" class="header-pref-row header-action-row header-menu-action"
              data-menu-action="bulk-edit">
        <span class="header-pref-label">{% translate 'Bulk edit' %}</span>
        <span class="header-action-btn" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1"></path>
            <path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z"></path>
            <path d="M16 5l3 3"></path>
          </svg>
        </span>
      </button>
    {% endif %}
    <button type="button" class="header-pref-row header-action-row header-menu-action"
            data-menu-action="layout">
      <span class="header-pref-label">{% translate 'Layout' %}</span>
      <span class="header-action-btn" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="9" y1="12" x2="21" y2="12"></line>
        </svg>
      </span>
    </button>
  </div>
</ld-dropdown>
