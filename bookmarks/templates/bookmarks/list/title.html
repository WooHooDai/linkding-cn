{% load i18n shared %}
<div class="title">
  <label class="form-checkbox bulk-edit-checkbox">
    <input type="checkbox" name="bookmark_id" value="{{ bookmark_item.id }}">
    <i class="form-icon"></i>
  </label>
  {% if bookmark_list.show_favicons %}
  <a href="?q=domain:%22{{ bookmark_item.url|extract_domain:request.user_profile }}%22" class="favicon-link">
    <img class="favicon" src="{% url 'linkding:favicon_image' domain=bookmark_item.favicon_domain %}" alt="" loading="lazy">
  </a>
  {% endif %}
  <a href="{{ bookmark_item.url }}" target="{{ bookmark_list.link_target }}" rel="noopener" class="title-link truncate">
    <span>{{ bookmark_item.title }}</span>
  </a>
  {% if bookmark_item.author %}
  <a href="?{% add_author_to_query bookmark_item.author %}" class="author" title="{% translate 'Author' %}"><span class="author-inner">{{ bookmark_item.author }}</span></a>
  {% endif %}
</div>
