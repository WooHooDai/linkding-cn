{% load i18n %}
<div class="content">
  <div class="compact-row">
    <div class="compact-head">
      {% include 'bookmarks/list/title.html' %}
    </div>
    <div class="compact-side">
      <button type="button" class="compact-toggle-btn" aria-expanded="false"
              title="{% translate 'Expand' %}"
              data-title-expand="{% translate 'Expand' %}"
              data-title-collapse="{% translate 'Collapse' %}">
        <svg class="compact-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 6 6 6 -6 6"/>
        </svg>
      </button>
    </div>
  </div>
  {% include 'bookmarks/list/description.html' %}
  {% include 'bookmarks/list/actions.html' %}
</div>
{% include 'bookmarks/list/notes.html' %}
