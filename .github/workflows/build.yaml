name: Publish Docker images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after every image passes validation
        type: boolean
        default: false
      baseline:
        description: Previous full image reference (prefer an immutable digest)
        type: string
        default: woohoodai/linkding-cn:latest
      baseline_base:
        description: Previous base image, after its first release
        type: string
        default: ""
      baseline_alpine:
        description: Previous Alpine base image, after its first release
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/image-validation.yaml
    with:
      upload_oci: ${{ inputs.publish }}
      baseline: ${{ inputs.baseline }}
      baseline_base: ${{ inputs.baseline_base }}
      baseline_alpine: ${{ inputs.baseline_alpine }}

  publish:
    needs: validate
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - { name: plus, flags: "" }
          - { name: base, flags: "--base" }
          - { name: base-alpine, flags: "--base --alpine" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-oci-${{ matrix.variant.name }}-*
          path: images
      - name: Install OCI copy tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the validated variants
        env:
          BUILD_FLAGS: ${{ matrix.variant.flags }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          read -r -a flags <<< "$BUILD_FLAGS"
          for repository in woohoodai/linkding-cn ghcr.io/woohoodai/linkding-cn; do
            mapfile -t tags < <(scripts/build-docker.sh "${flags[@]}" --push --print-tags --repository "$repository")
            sources=()
            for arch in amd64 arm64; do
              reference="${tags[1]}-$arch"
              skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
                "oci-archive:images/image-oci-${{ matrix.variant.name }}-$arch/linkding.oci.tar" "docker://$reference"
              sources+=("$reference")
            done
            tag_args=()
            for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          done
